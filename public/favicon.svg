<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: rounded square in deep navy -->
  <rect width="32" height="32" rx="7" fill="#0D1B2A"/>

  <!-- Amber accent bar top -->
  <rect x="3" y="5" width="8" height="2.5" rx="1.25" fill="#C07A2D"/>

  <!-- M letterform - white -->
  <path
    d="M3.5 23 L3.5 11 L8 18.5 L12.5 11 L12.5 23"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- First D letterform - amber -->
  <path
    d="M15 11 L15 23 M15 11 Q21 11 21 17 Q21 23 15 23"
    fill="none"
    stroke="#C07A2D"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Second D letterform - amber, slightly lighter -->
  <path
    d="M23 11 L23 23 M23 11 Q29.5 11 29.5 17 Q29.5 23 23 23"
    fill="none"
    stroke="#C07A2D"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
